name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to 3.12, not the runner's latest: the pinned dependency
          # set (fastapi 0.104.1, pydantic 2.5.2, pandas 2.1.1 among them)
          # predates prebuilt wheels for 3.13, which forces a from-source
          # build that needs a full Windows toolchain and fails outright on
          # this runner's image. 3.12 has wheels for the whole set.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        working-directory: backend
        # Scoped to real bugs (unused imports, undefined names), not
        # pyupgrade/import-sorting preferences that would rewrite the
        # existing code's style; see ruff.toml.
        run: ruff check app tests

      - name: Run tests
        working-directory: backend
        # No MongoDB or Redis service needed: conftest.py swaps in mongomock
        # and fakeredis before the app is imported, so this runs the same
        # way here as it does on a laptop with nothing else running.
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: frontend
        run: npm run build
