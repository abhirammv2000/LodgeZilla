apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kush2106/backend_image:v3.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: lodgezilla-secrets
                  key: mongo-uri
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lodgezilla-secrets
                  key: jwt-secret-key
            - name: REDIS_HOST
              value: redis-service
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
